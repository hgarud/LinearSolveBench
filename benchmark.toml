[benchmark]
id = "linear-solver-bench-cpu-v1"
schema_version = 1
numeric_type = "float64"
ranked_case_count = 203
repetitions = 3
ranking = "solved_count_then_penalized_geomean"

[accuracy]
contract = "three-gate-v1"
normwise_factor = 1.0
componentwise_factor = 5.0
forward_factor = 5.0
forward_floor = 2.0e-12
forward_ceiling = 2.0e-1
tolerance_tiers = [1.0e-4, 1.0e-3, 1.0e-2, 4.0e-2]

[candidate]
source_filename = "policy.c"
factory_export = "solver_create"
maximum_source_bytes = 65536
maximum_iterations = 10000
compile_timeout_seconds = 60

[execution]
cpu_physical_cores = 2.0
cpu_limit_physical_cores = 2.0
memory_mib = 4096
memory_limit_mib = 4096
network = false
mpi_ranks = 1
openmp_threads = 1
default_case_timeout_seconds = 120

[hypre]
repository = "https://github.com/hypre-space/hypre.git"
commit = "e0ce7986941ce27111587ee7ea635ef7ca2eca94"
tree = "c985eacc03d590011ab7652fe6fc4e9b25f1064d"
build = "sequential-cpu-float64-int32-static"

[dataset]
suite_sparse_index_sha256 = "f040a883a523c4621c5986aa66c39eeaa21bcae79c45596e953e7ea5e7ccbdb4"
suite_sparse_last_revision = "31-Oct-2023 18:12:37"
catalogue_sha256 = "8226ebe538dcd0590d1415a2057da8df5e332d5b51886654a3d9a0c0181b92cd"
qualification_sha256 = "30c7b765ed3f8c9712897c0be1d84890921cec90f5c6da122e9108100c8e3044"
tolerance_policy = "condition-aware-four-tier-v1"

[qualification]
condition_norm = "1"
method = "spqr-guarded-onenormest-v1"
rank_method = "SuiteSparseQR"
estimator_repeats = 3
estimator_guard_factor = 3.0
onenormest_t = 4
onenormest_itmax = 10

# Pilot settings are resolved from each frozen release manifest. The sections
# above continue to describe the original v1 benchmark.
[pilot]
id = "linear-solver-bench-pilot-cpu-v2"
schema_version = 2
execution_contract = "independent-case-once-v1"
repetitions = 1
settings_source = "release_manifest"

[pilot.ns_mesh]
family = "ns-mesh-pde"
track = "coverage"
accuracy_contract = "ns-mesh-accuracy-v1"
scoring_contract = "ns-coverage-count-v1"
development_manifest = "ns-mesh-dev-pilot"
normwise_backward_limit = 1.0e-10
componentwise_backward_limit = 1.0e-8
forward_limit = 1.0e-5
ranking = "solved_count"
timing_reference_required = false

[pilot.flash_replay]
family = "magnetic_diffusion_flash"
track = "replay"
accuracy_contract = "flash-replay-accuracy-v1"
scoring_contract = "flash-replay-speedup-v1"
dataset_repository = "hgarud/LinearSolveBench"
relative_residual_slack = 1.0e-6
ranking = "weighted_geometric_speedup"
timing_reference_required = true
